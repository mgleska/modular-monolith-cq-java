spring.application.name=mm-cq-java-2
spring.profiles.active=${ENVIRONMENT_NAME:local}
spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}/${DB_DATABASE:mm-cq-java}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:db_password}
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.main.banner-mode=off

#logging.level.org.springframework.security=DEBUG
logging.level.root=WARN
logging.level.org.flywaydb.core.internal.database.base.Database=ERROR
logging.level.com.mgleska.mmcqjava2.offer.access.console=INFO
logging.level.com.mgleska.mmcqjava2.product.access.console=INFO
logging.level.com.mgleska.mmcqjava2.store.access.console=INFO
logging.level.com.mgleska.mmcqjava2.user.action.command.MailDemoCmd=INFO
logging.level.com.mgleska.mmcqjava2.mailer=INFO
logging.include-application-name=false

springdoc.use-fqn=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.defaultModelsExpandDepth=-1
springdoc.swagger-ui.defaultModelExpandDepth=2

app.secret=SecretSecretSecretSecretSecretSecretSecretSecret
app.mm-cq.access-token-ttl=28800

spring.threads.virtual.enabled=true

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:root}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aaaa}